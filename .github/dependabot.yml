version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/vendor/phpmailer/PHPMailer-6.10.0"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Prague"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
